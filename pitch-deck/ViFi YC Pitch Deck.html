<script type="application/json" id="speaker-notes">
[
  "Hi, I'm Zach Popowitz, founder of ViFi. We extract heart rate, breathing, presence, and more directly from the WiFi signals in a hospital room. As of this month, we have 4.15 bpm cross-session heart rate accuracy on real hardware that costs forty-four dollars total. That's the headline. Let me explain why it matters.",
  "Here's the problem. Outside the ICU, hospital patients are checked manually every 4 to 8 hours. For 23 out of every 24 hours, no one is actually watching. The signs of sepsis, respiratory decline, and cardiac events show up between rounds, and by the time a nurse arrives, they've often passed.",
  "Here's the result we have today. 4.15 beats per minute, mean absolute error, cross-session, on two ESP32-S3 chips that together cost forty-four dollars. Validated against a Polar H10 chest strap with leave-one-session-out cross-validation. PhaseBeat at INFOCOM 2017 hit similar accuracy on Intel 5300 NICs at five hundred dollars per node. We replicated it on hardware that costs roughly one twenty-fifth as much. Technical risk on the core problem is retired.",
  "Why has nobody done this in a hospital? Because the existing monitoring stack is expensive, invasive, and narrow. Bedside monitors cost three to five thousand dollars apiece. They need wires and adhesives that patients pull off. And each one measures one vital in one spot. That's why continuous monitoring only exists in the ICU — which is about 10 percent of beds.",
  "So we built something different. One sensor pair in the room. Every vital sign the room can physically tell us. Two ESP32 chips, dual-band antennas, forty-four dollars total. A software pipeline that turns the radio noise between them into vitals.",
  "Here's how it works technically. Two ESP32-S3 nodes exchange WiFi packets at seventy to a hundred packets per second across one hundred ninety-two subcarriers. The patient's chest-wall motion from breathing and heartbeat modulates the channel state information — that's the technical name for the per-subcarrier complex amplitude. We rank subcarriers by signal-band variance, bandpass between point-one and three hertz, take a four-times-zero-padded FFT, refine peaks parabolically in the cardiac and respiratory bands, and feed nine features into XGBoost. That's the pipeline. It's deterministic, well-instrumented, and forty-one tests pass on main.",
  "Six capabilities, all from the same pair of chips. Heart rate is shipped today on real hardware. Presence is shipped — variance-threshold occupancy detection. Respiratory rate's pipeline is shipped, awaiting paired ground truth in June. Apnea, gait, falls, and a four-node multi-patient array all run on the same CSI stream — they're stages two and three. Adding a new vital is a software change, not a hardware change.",
  "Commercial case. A traditional bedside monitor is three to five thousand dollars per bed, hardware only. Our hardware is forty-four dollars per room. Two orders of magnitude. ESP32-S3 ships over a billion units a year. At forty-four dollars a room, the addressable market stops being the ICU and starts being every bed.",
  "Side by side against traditional monitors. No contact, every bed instead of ten percent, continuous instead of rounds, six capabilities instead of one device per vital, and on heart rate we're at 4.15 bpm MAE today on commodity hardware against a reference-grade chest strap.",
  "People ask, why hasn't anyone done this. The academic community has. PhaseBeat. FullBreathe. ResBeat. WiGait. WiFall. A decade of validated work — but always on five-hundred-dollar Intel 5300 NICs that aren't deployable. Our contribution is not novel signal processing. It's clinical packaging on ten-dollar chips that you can actually buy in volume.",
  "Where we are. April 2026, today: 4.15 bpm cross-session HR MAE, 41 tests passing. May, multi-subject validation across ten-plus subjects targeting sub-three-bpm cross-subject MAE. June, RR ground truth captures with a Vernier respiration belt. Months two through eight, apnea, gait, falls, the multi-patient array. Months nine through twelve, first hospital pilot — wellness-grade, no FDA needed. Months twelve to eighteen, FDA 510(k) filing for vitals monitoring, around three hundred thousand dollars all-in.",
  "On market — there are 920,000 hospital beds in the U.S. alone, and 18.6 million worldwide. About 10 percent of U.S. beds are ICU, which is the current addressable market for continuous monitoring. At forty-four dollars a room, every bed becomes addressable. We're not hand-waving a TAM number. We're saying: the economics unlock a market that didn't exist before.",
  "What's actually real today. Real-hardware HR — 4.15 bpm cross-session MAE versus Polar H10. DSP pipeline shipped, 41 tests passing. Capture rig hands-free for two-minute paired captures over BLE plus CSI. Presence detection live at the API. Multi-subject validation in May. FDA wellness-grade pilot first, 510(k) months twelve to eighteen. Everything on this slide is verifiable in the public repo at github dot com slash Zpopowitz slash vifi-ml.",
  "Why I'm doing this. My mom's first pain was November 13. By November 22 she'd been seen four times and told it was a UTI. It wasn't — it was Staphylococcus bacteremia with spinal and intra-abdominal abscesses. Five nights in the hospital, and what haunts me is that her vitals spiked between rounds. The chart said 'stable.' ViFi is the system I wish had been in her room.",
  "Team. Today it's me — I built the full ML pipeline, the API, the dashboard. Before this I was an ML engineer working on production clinical NLP. I'm actively hiring a co-founder RF engineer, a clinical partnerships lead, and a regulatory advisor. I am telling you I'm solo because that's the truth and because it's fixable.",
  "To close. Contactless hospital vitals from WiFi signals. 4.15 bpm MAE today on forty-four dollars of hardware. Every bed. Every vital the room can tell us. Thank you — happy to take questions."
]
</script>
