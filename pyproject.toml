[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vifi"
dynamic = ["version"]
description = "Contactless heart-rate and respiratory-rate monitoring from WiFi CSI on ESP32-S3 hardware."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ViFi contributors" }]

[tool.setuptools.dynamic]
version = { attr = "__version__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["modules", "tools"]
exclude = ["tests*", "data*", "models*"]

# ---------------------------------------------------------------------------
# ruff: replaces black + isort + flake8 + pyupgrade + pep8-naming. Single
# tool, fast, well-documented. Configured to be strict on new files but
# tolerant of the existing codebase (gradual cleanup).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "data",
    "models",
    "models_real",
    ".venv",
    "build",
]

[tool.ruff.lint]
# Pragmatic baseline: catch bugs + import hygiene, defer style preferences.
# Re-add stricter rule families incrementally as we clean up:
#   N    : pep8-naming      (X, Y conventional in DSP code)
#   B    : bugbear          (mostly fine; pulls in some false positives)
#   S    : bandit           (security; bandit job already runs separately)
#   T20  : print            (we use print() in CLI tools intentionally)
#   UP   : pyupgrade        (would force py311+ syntax on existing code)
#   PLR  : pylint refactor  (subjective branching/complexity rules)
select = ["E", "W", "F", "I"]

ignore = [
    "E501",     # line length handled by formatter
    "E731",     # lambdas allowed in DSP for math expressivity
    "E402",     # module-level import not at top (sys.path inserts before imports)
    "E701",     # multiple statements on one line (colon) — used in some terse DSP loops
    "E702",     # multiple statements on one line (semicolon) — same
    "E741",     # ambiguous variable name (l, I, O)
    "F401",     # imported but unused — caught more reliably by mypy on strict modules
    "F403",     # star imports — sometimes unavoidable in workflow tools
    "F405",     # name may be undefined from star import
    "F841",     # local var assigned but never used (common in DSP variants)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F811",   # redefinition (fixtures + parametrize sometimes redefine)
    "E501",
]
"docs/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["modules", "tools"]
combine-as-imports = true

# ---------------------------------------------------------------------------
# mypy: strict on new modules, lenient on existing science code.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false  # tests intentionally ignore some
ignore_missing_imports = true
exclude = ["build/", "data/", "models/"]

[[tool.mypy.overrides]]
# Strict only on the simplest, most-isolated modules. security.py +
# audit.py use FastAPI/Starlette callbacks where strict typing fights
# the framework; ramp them up gradually instead.
module = ["pseudonymize", "config", "__version__"]
strict = true

# Note: the previous lenient override block for security, audit, preprocess,
# calibration, quality, data_gen, train, observability was removed. CI only
# invokes mypy on the strict modules above; the lenient block was inert
# (mypy reported it as unused) and gave a false sense of type coverage on
# those 8 modules. To add a module to type-checked status: add it to the
# `mypy` line in `.github/workflows/ci.yml` and fix the resulting errors.

# ---------------------------------------------------------------------------
# pytest: test discovery + markers
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pytest-asyncio: pin the fixture loop scope explicitly so we don't trip the
# pending default-change warning on every run. "function" matches the future
# default and is what every async fixture in this repo wants today.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end tests requiring docker compose (slow)",
    "perf: performance regression tests (timing-sensitive)",
    "hardware: tests that require real BLE/USB hardware (skip in CI)",
    "slow: tests >5s",
]
addopts = [
    "-ra",          # short summary of skips/xfails
    "--strict-markers",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "data_gen.py",  # synthetic generator is sanity-only; not on prod path
    "*/__init__.py",
    "build/*",
]
branch = true
# Single-process coverage; pytest doesn't fork by default. With
# parallel=true (the default in some pytest-cov releases), stale
# `.coverage.<pid>` files from prior runs get auto-combined with the
# current run's data — which fails noisily when branch settings
# differ between the two. Locking parallel=false eliminates that
# whole class of CI flake.
parallel = false
data_file = ".coverage"

[tool.coverage.report]
# Floor commitment, ramped per milestone (see docs/DEFERRED_ITEMS.md
# "Coverage ramp" section for the targets + rationale):
#   M1 (now)       40   ← we are here (~41% baseline; 40 locks in
#                       no-regression without tripping on flaky
#                       deltas)
#   M2 (pilot)     55   ← bump after CSI quality gate + scope
#                       enforcement tests land in service of the
#                       pilot
#   M3 (multi-site) 70  ← multi-tenancy refactor will require
#                       broader integration tests anyway
#   M4 (pre-FDA)   85   ← FDA submission baseline; expects ~80%+
#                       on the safety-critical modules
# Hardware loggers + dashboard interactivity + capture
# orchestration need hardware-mock harnesses to lift these higher.
fail_under = 40
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    # Hardware-only branches that need a real Polar / Vernier / ESP32
    # to exercise; integration tests cover them, not unit tests.
    "if not BleakClient",
    "if serial is None",
]
