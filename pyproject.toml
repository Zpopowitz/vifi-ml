[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vifi"
dynamic = ["version"]
description = "Contactless heart-rate and respiratory-rate monitoring from WiFi CSI on ESP32-S3 hardware."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ViFi contributors" }]

[tool.setuptools.dynamic]
version = { attr = "__version__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["modules", "tools"]
exclude = ["tests*", "data*", "models*"]

# ---------------------------------------------------------------------------
# ruff: replaces black + isort + flake8 + pyupgrade + pep8-naming. Single
# tool, fast, well-documented. Configured to be strict on new files but
# tolerant of the existing codebase (gradual cleanup).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "data",
    "models",
    "models_real",
    ".venv",
    "build",
]

[tool.ruff.lint]
# Pragmatic baseline: catch bugs + import hygiene, defer style preferences.
# Re-add stricter rule families incrementally as we clean up:
#   N    : pep8-naming      (X, Y conventional in DSP code)
#   B    : bugbear          (mostly fine; pulls in some false positives)
#   S    : bandit           (security; bandit job already runs separately)
#   T20  : print            (we use print() in CLI tools intentionally)
#   UP   : pyupgrade        (would force py311+ syntax on existing code)
#   PLR  : pylint refactor  (subjective branching/complexity rules)
select = ["E", "W", "F", "I"]

ignore = [
    "E501",     # line length handled by formatter
    "E731",     # lambdas allowed in DSP for math expressivity
    "E402",     # module-level import not at top (sys.path inserts before imports)
    "E701",     # multiple statements on one line (colon) — used in some terse DSP loops
    "E702",     # multiple statements on one line (semicolon) — same
    "E741",     # ambiguous variable name (l, I, O)
    "F401",     # imported but unused — caught more reliably by mypy on strict modules
    "F403",     # star imports — sometimes unavoidable in workflow tools
    "F405",     # name may be undefined from star import
    "F841",     # local var assigned but never used (common in DSP variants)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F811",   # redefinition (fixtures + parametrize sometimes redefine)
    "E501",
]
"docs/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["modules", "tools"]
combine-as-imports = true

# ---------------------------------------------------------------------------
# mypy: strict on new modules, lenient on existing science code.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false  # tests intentionally ignore some
ignore_missing_imports = true
exclude = ["build/", "data/", "models/"]

[[tool.mypy.overrides]]
module = ["security", "pseudonymize", "audit", "config", "__version__"]
strict = true

[[tool.mypy.overrides]]
module = ["preprocess", "calibration", "quality", "data_gen", "train"]
# Science code uses numpy duck typing extensively; full strict mode is
# more friction than value here. Loosen until the team chooses to invest.
strict = false

# ---------------------------------------------------------------------------
# pytest: test discovery + markers
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end tests requiring docker compose (slow)",
    "perf: performance regression tests (timing-sensitive)",
    "hardware: tests that require real BLE/USB hardware (skip in CI)",
    "slow: tests >5s",
]
addopts = [
    "-ra",          # short summary of skips/xfails
    "--strict-markers",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "data_gen.py",  # synthetic generator is sanity-only; not on prod path
    "*/__init__.py",
    "build/*",
]
branch = true

[tool.coverage.report]
fail_under = 70           # gradual ramp; bump to 85 over time
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
