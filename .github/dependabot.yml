# Dependabot config: auto-PRs for dependency updates.
#
# Required for FDA cybersecurity premarket plan (2023): demonstrate a
# documented process for managing third-party software vulnerabilities.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      # pytest and its plugins share coupled version constraints
      # (pytest-asyncio>=1.4 requires pytest>=8.4, etc.). Group ALL pytest*
      # packages across every update-type so Dependabot proposes them in ONE
      # PR and cannot split-bump a plugin past what the pinned pytest allows.
      # This class of break took main's CI red: #92 bumped pytest-asyncio to
      # 1.4.0 alone while pytest stayed ==8.3.4, making the dev install
      # unresolvable. Listed first so pytest* land here, not the catch-all.
      # NOTE: pytest* is fully ignored below, so this group is currently moot;
      # it is kept as a guard in case that ignore is ever lifted.
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
        update-types:
          - major
          - minor
          - patch
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    # Dev-only tooling pinned in places Dependabot cannot see. The linter and
    # type-checker revs live in .pre-commit-config.yaml AND as hardcoded
    # `pip install` lines in .github/workflows/ci.yml (ruff==0.6.9 at the lint
    # job; pytest==8.3.4 at the e2e job), on top of the pytest/pytest-asyncio
    # version coupling documented in requirements-dev.txt. Dependabot sees only
    # requirements-dev.txt, so a lone bump here silently desyncs the other
    # locations and turns `make format`/CI red -- the #92-class break above.
    # These ship in NO production artifact and carry no runtime or
    # patient-facing vulnerability surface, so they are bumped MANUALLY across
    # every pinned location together, not by Dependabot. Runtime deps (numpy,
    # scipy, scikit-learn, fastapi, ...) and the security scanners (pip-audit,
    # bandit) are deliberately NOT ignored -- keeping those current is the
    # documented FDA cybersecurity control at the top of this file.
    ignore:
      - dependency-name: "pytest"
      - dependency-name: "pytest-*"
      - dependency-name: "ruff"
      - dependency-name: "mypy"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
