name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .
      # `ruff format --check` is opt-in via `make format` until the
      # existing 70-file style sweep lands as its own PR. Tracked in
      # docs/DEFERRED_ITEMS.md.

  type:
    name: Type check (mypy on strict modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: mypy strict modules
        run: mypy pseudonymize.py config.py __version__.py
      - name: mypy lenient modules (warn-only; never fails CI)
        run: mypy security.py audit.py observability.py || true

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: Install test deps (must succeed before pytest)
        run: pip install -r requirements-dev.txt
      - name: Sanity check — hypothesis must be importable
        run: python -c "import hypothesis; print('hypothesis', hypothesis.__version__)"
      - name: Train synthetic models (needed by some tests)
        run: python train.py -n 500
      - name: pytest
        run: pytest -v --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security scan (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pip-audit==2.7.3 bandit==1.7.10
      - name: pip-audit
        # `--ignore-vuln` for advisories we can't clear without a coupled
        # FastAPI / streamlit / pip-runtime upgrade. Each is reviewed
        # below; remove the flag when the upstream bump is feasible.
        #
        # GHSA-cfh3-3jmp-rvhc, GHSA-whj4-6x5x-4v2j: pillow 10.4 — pillow
        #     is transitive from streamlit; clears when streamlit can
        #     safely move to 1.54 (Dependabot PR pending).
        # GHSA-2c2j-9gv5-cj73, GHSA-7f5h-v6xp-fcq8: starlette 0.41.3 —
        #     pinned by FastAPI 0.115.x's range. Clears when FastAPI
        #     bumps to 0.116+ which allows starlette >=0.42.
        # GHSA-58qw-9mgm-455v: pip itself in the GitHub runner. We
        #     can't pin pip in our requirements; runner ships its own.
        run: |
          pip-audit \
            --ignore-vuln GHSA-cfh3-3jmp-rvhc \
            --ignore-vuln GHSA-whj4-6x5x-4v2j \
            --ignore-vuln GHSA-2c2j-9gv5-cj73 \
            --ignore-vuln GHSA-7f5h-v6xp-fcq8 \
            --ignore-vuln GHSA-58qw-9mgm-455v
      - name: bandit
        run: bandit -r . -x tests,build,sbom -ll

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom==4.6.1
      - name: Generate Python SBOM
        run: |
          mkdir -p sbom
          # cyclonedx-bom 4.x has two CLI forms across patch versions;
          # try the older one first and fall back to the newer.
          cyclonedx-py -r -i requirements.txt --format json \
              -o sbom/python-deps.json \
            || cyclonedx-py requirements -i requirements.txt --of JSON \
                  -o sbom/python-deps.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  docker-build:
    name: Docker build + structural compose check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vifi-ml:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose config validates
        run: docker compose config --quiet
      - name: Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vifi-ml:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'           # advisory until baseline is clean
