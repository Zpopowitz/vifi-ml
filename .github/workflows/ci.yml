name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    branches: [main]
    paths-ignore: ['site/**']

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        # The 86-file style sweep landed in PR-B-format; from this
        # commit onward the formatter is enforced in CI.
        run: ruff format --check .

  type:
    name: Type check (mypy on strict modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: mypy strict modules
        run: mypy pseudonymize.py config.py __version__.py
      # The previous "mypy lenient modules" step (security.py + audit.py
      # + observability.py with `|| true`) was theatrical — it ran but
      # never failed CI even when types were wrong. Removing it; when
      # we're ready to commit to strict types on those modules, add
      # them to the strict line above (currently 24 pre-existing errors
      # to clear; M2 work).

  audit-chain:
    name: Audit chain integrity (smoke verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -r requirements.txt
      - name: Generate + verify a sample audit chain
        # The hash-chained audit log is FDA-grade evidence. A bug in the
        # writer that breaks the chain is a regression nobody would
        # notice from pytest alone -- the unit tests cover the writer
        # logic, but they don't exercise the CLI verifier end-to-end
        # against a freshly-generated chain. This step does that:
        # write 5 audit records via AuditLogWriter, then run
        # `python -m tools.audit_verify --audit-dir <gen>` and assert
        # exit 0.
        env:
          VIFI_AUDIT_CHAIN_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          # Pseudonymization is fail-closed by default; give CI a real
          # salt (>= 32 chars enforced) so the smoke exercises the
          # production HMAC path.
          VIFI_PSEUDO_SALT: "ci-smoke-only-not-a-secret-0123456789abcdef"
        run: |
          set -euo pipefail
          mkdir -p /tmp/vifi-audit-smoke
          python <<'PYEOF'
          from pathlib import Path
          from audit import AuditLogWriter
          w = AuditLogWriter(audit_dir=Path("/tmp/vifi-audit-smoke"))
          for i in range(5):
              w.write({
                  "event": "ci_smoke",
                  "i": i,
                  "patient_id": "ci-smoke",
              })
          w.close()
          PYEOF
          python -m tools.audit_verify --audit-dir /tmp/vifi-audit-smoke

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade "pip>=26.1"
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: Install test deps (must succeed before pytest)
        run: pip install -r requirements-dev.txt
      - name: Sanity check — hypothesis must be importable
        run: python -c "import hypothesis; print('hypothesis', hypothesis.__version__)"
      - name: Build the test-fixture model (needed by tests of the predict pipeline)
        # train.py trains an XGBoost regressor on synthetic data and writes it
        # to models/. The test suite loads it as the single bundle's fixture --
        # there is no longer a separate "synthetic serving model" concept.
        run: python train.py -n 500
      - name: Remove any stale coverage data
        # Belt-and-suspenders alongside `parallel = false` in
        # pyproject.toml: makes sure no .coverage.<pid> files from
        # earlier steps (or runner cache) collide with the new run.
        run: rm -f .coverage .coverage.* coverage.xml
      - name: pytest
        # Deselect e2e: those need docker compose + the built image,
        # and run as a separate job after docker-build.
        run: pytest -v -m "not e2e" --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security scan (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          # Upgrade pip first so pip-audit doesn't flag the
          # runner-bundled pip on its own dependency advisories
          # (e.g. GHSA-jp4c-xjxw-mgf9 against pip <26.1).
          python -m pip install --upgrade "pip>=26.1"
          pip install -r requirements.txt
          pip install pip-audit==2.7.3 bandit==1.7.10
      - name: pip-audit
        # `--ignore-vuln` for advisories we can't clear without a coupled
        # FastAPI / streamlit / pip-runtime upgrade. Each is reviewed
        # below; remove the flag when the upstream bump is feasible.
        #
        # GHSA-cfh3-3jmp-rvhc, GHSA-whj4-6x5x-4v2j: pillow 10.4 — pillow
        #     is transitive from streamlit; clears when streamlit can
        #     safely move to 1.54 (Dependabot PR pending).
        # GHSA-2c2j-9gv5-cj73, GHSA-7f5h-v6xp-fcq8: starlette 0.41.3 —
        #     pinned by FastAPI 0.115.x's range. Clears when FastAPI
        #     bumps to 0.116+ which allows starlette >=0.42.
        # PYSEC-2024-277 (CVE-2024-34997): joblib numpy_pickle
        #     deserialization. No fixed joblib version exists, so it
        #     cannot be cleared by a bump. Disputed by the joblib
        #     maintainers ("NumpyArrayWrapper is only used during
        #     caching of trusted content"). ViFi loads only its own
        #     model artifacts via joblib, never untrusted pickles —
        #     no exposure. Re-review if joblib ships a fix.
        # (Earlier pip advisory GHSA-58qw-9mgm-455v cleared by the
        #  pip>=26.1 upgrade in the install step above.)
        run: |
          pip-audit \
            --ignore-vuln GHSA-cfh3-3jmp-rvhc \
            --ignore-vuln GHSA-whj4-6x5x-4v2j \
            --ignore-vuln GHSA-2c2j-9gv5-cj73 \
            --ignore-vuln GHSA-7f5h-v6xp-fcq8 \
            --ignore-vuln PYSEC-2024-277
      - name: bandit
        # bandit's -x argument needs './path' style entries (not bare
        # names) for the directory-exclude to actually work in 1.7.x
        # — otherwise it scans tests/ etc. anyway and we have to
        # # nosec annotate every test file. Found this the hard way.
        #
        # ./tools/spi_debug is excluded for the same reason as ./tests:
        # it is bench-research / board-bringup scratch (pickle.load of our
        # OWN local capture artifacts, never untrusted input; no network
        # surface), not part of the serving path (radar/, api.py,
        # tools/radar_{collector,inference_worker}.py stay scanned).
        run: bandit -r . -x ./tests,./build,./sbom,./site,./tools/spi_debug -ll

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install cyclonedx-bom
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install cyclonedx-bom==4.6.1
      - name: Generate Python SBOM
        run: |
          mkdir -p sbom
          # cyclonedx-bom 4.x has two CLI forms across patch versions;
          # try the older one first and fall back to the newer.
          cyclonedx-py -r -i requirements.txt --format json \
              -o sbom/python-deps.json \
            || cyclonedx-py requirements -i requirements.txt --of JSON \
                  -o sbom/python-deps.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  docker-build:
    name: Docker build + structural compose check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vifi-ml:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose config validates
        run: docker compose config --quiet
      - name: Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vifi-ml:ci
          format: table
          severity: CRITICAL,HIGH
          # Blocking: a HIGH/CRITICAL CVE with an available fix fails CI.
          # Unfixed CVEs (no patched package exists yet) are excluded so
          # the gate stays actionable; acknowledged findings go in
          # .trivyignore with a justification + expiry.
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  e2e:
    name: End-to-end (compose smoke)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install pytest==8.3.4
      - name: Build image (cached from docker-build job)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vifi-ml:latest
          cache-from: type=gha
      - name: Run e2e smoke
        run: pytest -v -m e2e tests/test_compose_e2e.py
        env:
          # Compose pulls the image we just loaded by name+tag.
          COMPOSE_DOCKER_CLI_BUILD: "1"
