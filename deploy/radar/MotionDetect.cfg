% ***************************************************************
% MotionDetect:  Chirp configuration and Processing chain are
% designed to detect moving objects, including estimation of
% range, velocity and angle of the objects.  It is typically
% useful for detecting, localizing and tracking objects in
% indoor or outdoor settings.
% ***************************************************************
% ViFi FROZEN PLATFORM (v3, 2026-06-10): 25 fps (framePeriodicity 40 ms).
% WP1 bench ceiling: 25 fps holds clean over a 20-min keep-chirps soak (30113
% frames, no drift); 30 fps trips the firmware "Frame Time is not enough to
% transfer" warning (6144-byte SPI transfer needs ~40 ms). 20 ms/10 ms (50/100
% fps) collapse to ~2 fps. Faster than 25 needs firmware timing work.
% MotionDetect_20fps.cfg is the previous profile (pre-v3 / live-compat).
sensorStop 0
channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 75 60.5
frameCfg 2 8 600 2 40 0
guiMonitor 2 1 0 0 0 1 0 0 0 0 0
sigProcChainCfg 64 4 1 2 8 4 0 0.3 0
cfarCfg 2 8 4 3 0 15 0 0.5 0 1 1 1
aoaFovCfg -70 70 -60 60
rangeSelCfg 0.25 7.5
clutterRemoval 1
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 1
factoryCalibCfg 1 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 1.5 0 0
mpdBoundaryBox 1 -3.5 0 0 3.5 0 3
mpdBoundaryBox 2 -3.5 0 3.51 7 0 3
mpdBoundaryBox 3 0.01 3.5 0 3.5 0 3
mpdBoundaryBox 4 0.01 3.5 3.51 7 0 3
majorStateCfg 5 4 20 15 12 40 4 20
clusterCfg 1 1 2
baudRate 1250000
sensorStart 0 0 0 0
