# ViFi live software stack — fully containerized.
#
# Bring up everything (Redis + API + inference + audit + dashboard):
#
#     docker compose up -d
#
# Open the dashboard at http://localhost:8501  (Live tab,
# patient_id=default).
#
# To test the pipeline end-to-end without hardware, also start the
# simulator (a synthetic CSI publisher):
#
#     docker compose --profile dev up -d
#
# Hardware loggers stay on the host because they need direct BLE / USB
# serial access:
#
#     # On the host:
#     export VIFI_BUS_URL=redis://localhost:6379/0
#     python hr_logger.py  --address AA:BB:... --bus --patient-id alice ...
#     python rr_logger.py  --bus --patient-id alice ...
#     python tools/csi_capture.py --port COM6 --bus --patient-id alice ...
#
# Patient id defaults to ${VIFI_PATIENT_ID:-default}; export
# VIFI_PATIENT_ID before `docker compose up` to scope every service
# (worker, audit, simulator) to a different patient.

x-app-base: &app-base
  build: .
  environment: &app-env
    VIFI_BUS_URL: redis://redis:6379/0
    VIFI_PATIENT_ID: ${VIFI_PATIENT_ID:-default}
    LOG_LEVEL: INFO
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    container_name: vifi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    <<: *app-base
    container_name: vifi-api
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    healthcheck:
      # The API serves a real /health endpoint; curl is in the runtime image.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  inference_worker:
    <<: *app-base
    container_name: vifi-inference
    command: >
      python -m tools.inference_worker
      --patient-id ${VIFI_PATIENT_ID:-default}
      --window 10 --stride 2 --fs-resample 100
    healthcheck:
      # Worker has no HTTP surface, so liveness is "can still talk to the
      # bus." If Redis becomes unreachable the worker's stuck anyway.
      test: ["CMD", "python", "-c",
             "import os, redis; redis.from_url(os.environ['VIFI_BUS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  audit_subscriber:
    <<: *app-base
    container_name: vifi-audit
    volumes:
      # Persist audit JSONL on the host so it survives container restarts
      # and can be inspected without `docker exec`.
      - ./data/audit:/app/data/audit
    environment:
      <<: *app-env
      VIFI_AUDIT_DIR: /app/data/audit
    command: >
      python -m tools.audit_subscriber
      --patient-id ${VIFI_PATIENT_ID:-default}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os, redis; redis.from_url(os.environ['VIFI_BUS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    <<: *app-base
    container_name: vifi-dashboard
    environment:
      <<: *app-env
      VIFI_API: http://api:8000
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    command: >
      streamlit run dashboard.py
      --server.address 0.0.0.0 --server.port 8501
      --server.headless true
      --browser.gatherUsageStats false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Synthetic CSI publisher for end-to-end testing without hardware.
  # Behind the `dev` profile so it doesn't start in production-style runs.
  #
  #     docker compose --profile dev up -d        # bring up sim too
  #     docker compose stop simulator              # stop just the sim
  simulator:
    <<: *app-base
    container_name: vifi-simulator
    profiles: ["dev"]
    command: >
      python tools/esp32_csi_collector.py
      --simulate --bus --bus-only
      --patient-id ${VIFI_PATIENT_ID:-default}
    # No healthcheck: it's a one-shot generator, not a service. If it
    # crashes the dashboard simply stops getting new windows.

volumes:
  # Reserved for future Redis persistence (RDB/AOF). Today the bus is
  # ephemeral; predictions and reference readings are durable in audit
  # logs (./data/audit) and CSV files written by the host loggers.
  redis_data:
