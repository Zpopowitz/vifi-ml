# ViFi live software stack (containerized).
#
# Brings up the parts of ViFi that don't touch hardware: Redis (the
# message bus), the FastAPI service, the inference worker, and the
# universal audit subscriber.
#
# Hardware loggers stay on the host because they need direct access to
# Bluetooth (Polar H10 / Vernier GDX-RB) or USB serial (ESP32-S3):
#
#     # On the host (Windows PowerShell or Linux):
#     export VIFI_BUS_URL=redis://localhost:6379/0
#
#     # CSI ingest (one of):
#     python tools/csi_capture.py --port COM6 --bus --patient-id alice ...
#     python tools/esp32_csi_collector.py --bus-only --patient-id alice ...
#
#     # HR reference:
#     python hr_logger.py --address AA:BB:... --bus --patient-id alice ...
#
#     # RR reference (Vernier GDX-RB):
#     python rr_logger.py --bus --patient-id alice ...
#
# Then bring everything else up with one command:
#
#     docker compose up
#
# The dashboard can run in a container too (uncomment the dashboard
# service below) or natively on the host (`streamlit run dashboard.py`).
#
# Patient id is fixed to ${VIFI_PATIENT_ID:-default} for the worker
# and audit subscriber. To run multiple patients, scale via:
#
#     docker compose up --scale inference_worker=N
#
# (and tweak the worker command to take patient id from an env var per
# replica) -- this is a v1 single-patient compose.

services:
  redis:
    image: redis:7-alpine
    container_name: vifi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: vifi-api
    environment:
      VIFI_BUS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  inference_worker:
    build: .
    container_name: vifi-inference
    environment:
      VIFI_BUS_URL: redis://redis:6379/0
      VIFI_PATIENT_ID: ${VIFI_PATIENT_ID:-default}
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    command: >
      python -m tools.inference_worker
      --patient-id ${VIFI_PATIENT_ID:-default}
      --window 10 --stride 2 --fs-resample 100
    restart: unless-stopped

  audit_subscriber:
    build: .
    container_name: vifi-audit
    environment:
      VIFI_BUS_URL: redis://redis:6379/0
      VIFI_AUDIT_DIR: /app/data/audit
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persist audit logs on the host so they survive container restarts
      # and can be inspected without docker exec.
      - ./data/audit:/app/data/audit
    command: >
      python -m tools.audit_subscriber
      --patient-id ${VIFI_PATIENT_ID:-default}
    restart: unless-stopped

  # Optional: run the Streamlit dashboard in a container too. Comment
  # out if you'd rather run it natively (`streamlit run dashboard.py`).
  # dashboard:
  #   build: .
  #   container_name: vifi-dashboard
  #   environment:
  #     VIFI_BUS_URL: redis://redis:6379/0
  #     VIFI_API: http://api:8000
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     api:
  #       condition: service_started
  #   ports:
  #     - "8501:8501"
  #   command: >
  #     streamlit run dashboard.py
  #     --server.address 0.0.0.0 --server.port 8501

volumes:
  # Reserved for future Redis persistence (RDB/AOF). Today the bus is
  # ephemeral; predictions and reference readings are durable in audit
  # logs (./data/audit) and CSV files written by the host loggers.
  redis_data:
